[project]
name = "business-entity-resolution-lab"
version = "0.1.0"
description = "Training-data exploration for the business entity resolution ML lab"
requires-python = ">=3.13,<3.14"
dependencies = [
    "polars>=2.1,<3",
    "plotly>=7.1,<8",
    "jupyterlab>=4.6,<5",
    "nbclient>=0.11,<0.12",
    "nbconvert>=7.17,<8",
    "beautifulsoup4>=4.15,<5",
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "scikit-learn>=1.7,<2",
    "xgboost>=3.1,<4",
    "rapidfuzz>=3.14,<4",
    "threadpoolctl>=3,<4",
]

[tool.uv]
package = false
